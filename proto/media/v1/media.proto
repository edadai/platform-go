syntax = "proto3";

package media.v1;

option go_package = "github.com/edadai/platform-go/contracts/mediav1;mediav1";

service MediaService {
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc BatchGetAssets(BatchGetAssetsRequest) returns (BatchGetAssetsResponse);
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse);
  rpc RetryAsset(RetryAssetRequest) returns (RetryAssetResponse);
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);
  rpc ReserveReferences(ReserveReferencesRequest) returns (ReserveReferencesResponse);
  rpc ReferenceCandidates(ReferenceCandidatesRequest) returns (ReferenceCandidatesResponse);
  rpc ReconcileReference(ReconcileReferenceRequest) returns (ReconcileReferenceResponse);
  rpc CreateOriginalDownload(CreateOriginalDownloadRequest) returns (CreateOriginalDownloadResponse);
  rpc RequestSocialRendition(RequestSocialRenditionRequest) returns (RequestSocialRenditionResponse);
}

message SocialRendition {
  string status = 1;
  string public_path = 2;
  string failure_reason = 3;
}

message RequestSocialRenditionRequest {
  string asset_id = 1;
  string consumer = 2;
  string resource_id = 3;
  double focal_x = 4;
  double focal_y = 5;
}
message RequestSocialRenditionResponse { SocialRendition rendition = 1; }

message Rendition {
  string recipe = 1;
  string public_path = 2;
  int32 width = 3;
  int32 height = 4;
  string mime_type = 5;
  int32 generation = 6;
}

message Asset {
  string id = 1;
  string purpose = 2;
  string owner_id = 3;
  string filename = 4;
  string mime_type = 5;
  int64 size_bytes = 6;
  string status = 7;
  int32 width = 8;
  int32 height = 9;
  string alt_text = 10;
  string caption = 11;
  double focal_x = 12;
  double focal_y = 13;
  bool focal_set = 14;
  int32 focal_version = 15;
  string failure_reason = 16;
  int32 attempts = 17;
  string last_error = 18;
  repeated Rendition renditions = 19;
}

message CreateUploadRequest {
  string purpose = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string actor_id = 5;
  string idempotency_key = 6;
}

message CreateUploadResponse {
  string id = 1;
  string asset_id = 2;
  string url = 3;
  map<string, string> fields = 4;
  string expires_at = 5;
  bool completed = 6;
}

message CompleteUploadRequest {
  string session_id = 1;
  string actor_id = 2;
  string purpose = 3;
}
message CompleteUploadResponse { Asset asset = 1; }

message ListAssetsRequest {
  string purpose = 1;
  int32 page = 2;
}

message ListAssetsResponse { repeated Asset assets = 1; }
message GetAssetRequest { string id = 1; }
message GetAssetResponse { Asset asset = 1; }
message BatchGetAssetsRequest { repeated string ids = 1; }
message BatchGetAssetsResponse { map<string, Asset> assets = 1; }

message UpdateAssetRequest {
  string id = 1;
  string actor_id = 2;
  string alt_text = 3;
  string caption = 4;
  double focal_x = 5;
  double focal_y = 6;
}
message UpdateAssetResponse { Asset asset = 1; }

message RetryAssetRequest {
  string id = 1;
  string actor_id = 2;
}
message RetryAssetResponse { bool ok = 1; }

message DeleteAssetRequest {
  string id = 1;
  string actor_id = 2;
}
message DeleteAssetResponse { bool ok = 1; }

message ReserveReferencesRequest {
  string consumer = 1;
  string resource_id = 2;
  repeated string asset_ids = 3;
}
message ReserveReferencesResponse { bool ok = 1; }

message ReferenceCandidatesRequest { string consumer = 1; }
message ReferenceCandidatesResponse { repeated string resource_ids = 1; }

message ReconcileReferenceRequest {
  string consumer = 1;
  string resource_id = 2;
  bool exists = 3;
}
message ReconcileReferenceResponse { bool ok = 1; }

message CreateOriginalDownloadRequest {
  string id = 1;
  string actor_id = 2;
}
message CreateOriginalDownloadResponse {
  string url = 1;
  string expires_at = 2;
  string source_version = 3;
  int64 source_size = 4;
}
