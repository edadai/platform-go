syntax = "proto3";

option csharp_namespace = "SubscriptionBillingService.Api.Protos";
option go_package = "github.com/edadai/platform-go/contracts/subscriptionbillingpb;subscriptionbillingpb";

package subscriptionbilling;

service SubscriptionBillingApi {
  rpc CreateProduct (CreateProductRequest) returns (EntityResponse);
  rpc CreatePlan (CreatePlanRequest) returns (EntityResponse);
  rpc CreatePrice (CreatePriceRequest) returns (EntityResponse);
  rpc SetDefaultPrice (EntityIdRequest) returns (PriceResponse);
  rpc DeactivatePrice (EntityIdRequest) returns (PriceResponse);
  rpc CreateOffer (CreateOfferRequest) returns (EntityResponse);
  rpc UpdateOffer (UpdateOfferRequest) returns (OfferResponse);
  rpc ConfigureOfferPhase (ConfigureOfferPhaseRequest) returns (EntityResponse);
  rpc ConfigureCatalogPresentation (ConfigureCatalogPresentationRequest) returns (EntityResponse);
  rpc EnableOffer (EntityIdRequest) returns (EntityResponse);
  rpc DisableOffer (EntityIdRequest) returns (EntityResponse);
  rpc AttachEntitlementToPlan (AttachEntitlementToPlanRequest) returns (EntityResponse);
  rpc UpsertPlanEntitlement (UpsertPlanEntitlementRequest) returns (PlanEntitlementResponse);
  rpc ConfigureOfferPolicy (ConfigureOfferPolicyRequest) returns (EntityResponse);
  rpc ConfigureBillingPolicy (ConfigureBillingPolicyRequest) returns (EntityResponse);
  rpc GetBillingSummary (BillingSummaryRequest) returns (BillingSummaryResponse);
  rpc GetSubscriptionStats (SubscriptionStatsRequest) returns (SubscriptionStatsResponse);
  rpc GetChurnStats (ChurnStatsRequest) returns (ChurnStatsResponse);
  rpc GetPaymentStats (PaymentStatsRequest) returns (PaymentStatsResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc ListPlans (ListPlansRequest) returns (ListPlansResponse);
  rpc GetPlan (EntityIdRequest) returns (PlanDetailResponse);
  rpc ListPlanPrices (EntityIdRequest) returns (ListPricesResponse);
  rpc ListOffers (ListOffersRequest) returns (ListOffersResponse);
  rpc ListBillingPolicies (ListPoliciesRequest) returns (ListBillingPoliciesResponse);
  rpc UpdatePlan (UpdatePlanRequest) returns (PlanResponse);
  rpc PublishPlan (EntityIdRequest) returns (PlanResponse);
  rpc ArchivePlan (EntityIdRequest) returns (PlanResponse);

  rpc ListSubscriptions (ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc StartSubscription (StartSubscriptionRequest) returns (SubscriptionResponse);
  rpc CancelSubscription (EntityIdRequest) returns (SubscriptionResponse);
  // Customer-initiated cancellation, honouring the period already paid for. CancelSubscription
  // is the administrative one and blocks access immediately.
  rpc ScheduleSubscriptionCancellation (EntityIdRequest) returns (SubscriptionResponse);
  rpc ResumeSubscription (EntityIdRequest) returns (SubscriptionResponse);
  rpc ChangePlan (ChangePlanRequest) returns (PlanChangeResponse);
  rpc GetSubscriptionStatus (EntityIdRequest) returns (SubscriptionStatusResponse);
  rpc GetCurrentSubscription (CustomerRequest) returns (SubscriptionResponse);

  rpc CheckEntitlement (CheckEntitlementRequest) returns (CheckEntitlementResponse);
  rpc GetEntitlementSnapshot (EntityIdRequest) returns (EntitlementSnapshotResponse);
  rpc RefreshEntitlementSnapshot (EntityIdRequest) returns (EntitlementSnapshotResponse);
  rpc RecordUsage (RecordUsageRequest) returns (EntityResponse);

  rpc CreateInvoice (CreateInvoiceRequest) returns (InvoiceResponse);
  rpc GetInvoice (EntityIdRequest) returns (InvoiceResponse);
  rpc ListAllInvoices (ListBillingDocumentsRequest) returns (ListInvoicesResponse);
  rpc ListInvoices (CustomerRequest) returns (ListInvoicesResponse);
  rpc MarkManualInvoicePaid (EntityIdRequest) returns (InvoiceResponse);
  // Customer-driven recovery of an outstanding invoice: with the saved card, or by entering a
  // new one at the provider. Both carry the customer id so the service scopes the invoice itself.
  rpc PayInvoice (PayInvoiceRequest) returns (PaymentResponse);
  rpc CreateInvoiceCheckout (CreateInvoiceCheckoutRequest) returns (PaymentIntentResponse);
  rpc ListPayments (ListBillingDocumentsRequest) returns (ListPaymentsResponse);
  rpc RefundPayment (RefundPaymentRequest) returns (EntityResponse);
  rpc RetryPayment (RetryPaymentRequest) returns (PaymentResponse);
  rpc ListPaymentRetryQueue (ListPaymentRetryQueueRequest) returns (ListPaymentRetryQueueResponse);
  rpc ProcessPaymentRetryQueue (ProcessPaymentRetryQueueRequest) returns (PaymentRetryBatchResponse);
  rpc CancelPaymentRetry (CancelPaymentRetryRequest) returns (EntityResponse);
  rpc ListLedgerAccounts (ListLedgerAccountsRequest) returns (ListLedgerAccountsResponse);
  rpc ListLedgerTransactions (ListLedgerTransactionsRequest) returns (ListLedgerTransactionsResponse);

  rpc CreateCheckout (CreateCheckoutRequest) returns (CheckoutResponse);
  rpc GetPaymentStatusByReference (PaymentReferenceRequest) returns (PaymentResponse);
  rpc VerifyPaymentReference (PaymentReferenceRequest) returns (PaymentResponse);

  rpc ReceivePaystackWebhook (ReceivePaystackWebhookRequest) returns (StatusResponse);
}

message ListPlansRequest { bool public_only = 1; }
message BillingSummaryRequest {}
message BillingSummaryResponse {
  int32 product_count = 1;
  int32 published_plan_count = 2;
  int32 active_subscription_count = 3;
  int32 trialing_subscription_count = 4;
  int32 open_invoice_count = 5;
  double open_invoice_amount = 6;
  int32 succeeded_payment_count = 7;
  double succeeded_payment_amount = 8;
  string currency = 9;
}

// Server-computed subscription aggregates. Timezone: Africa/Lagos.
message SubscriptionStatsRequest {}
message SubscriptionStatsResponse {
  int32 total_count = 1;
  int32 active_count = 2;
  int32 trialing_count = 3;
  int32 cancelled_count = 4;
  int32 expired_count = 5;
  int32 basic_count = 6;
  int32 premium_count = 7;
  int32 other_active_count = 8;
  int32 new_this_month_count = 9;
  int32 churned_this_month_count = 10;
  double total_mrr = 11;
  string currency = 12;
  repeated SubscriptionPlanBreakdownRow plan_breakdown = 13;
}

message SubscriptionPlanBreakdownRow {
  string plan_id = 1;
  string plan_code = 2;
  string plan_name = 3;
  string plan_display_name = 4;
  int32 active_subscribers = 5;
  int32 trialing_subscribers = 6;
  double plan_amount = 7;
  double monthly_amount = 8;
  double mrr = 9;
  string currency = 10;
}

// Churn analysis aggregates. The registered/verified funnel steps are populated by
// the caller from the user-stats endpoint since users live in auth-service; the fields
// here cover the subscription-side of the funnel plus churn reasons.
message ChurnStatsRequest {}
message ChurnStatsResponse {
  int32 subscription_started_customer_count = 1;
  int32 currently_active_customer_count = 2;
  int32 converted_to_paid_customer_count = 3;
  int32 at_risk_active_count = 4;
  int32 churned_this_month_count = 5;
  string churn_rate = 6;
  repeated ChurnReasonRow reasons = 7;
  repeated ChurnPlanRow plan_breakdown = 8;
}

message ChurnReasonRow {
  string label = 1;
  int32 count = 2;
}

message ChurnPlanRow {
  string plan_id = 1;
  string label = 2;
  int32 active = 3;
  int32 churned = 4;
  string churn_rate = 5;
}

// Payment workload + retry queue counters. Timezone: Africa/Lagos.
message PaymentStatsRequest {}
message PaymentStatsResponse {
  int32 succeeded_count = 1;
  int32 failed_count = 2;
  int32 refunded_count = 3;
  int32 processed_today_count = 4;
  int32 resolved_today_count = 5;
  int32 due_today_count = 6;
  int32 open_invoice_count = 7;
  double open_invoice_amount = 8;
  string currency = 9;
}
message ListProductsRequest { bool active_only = 1; }
message ProductResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  bool is_active = 5;
  string created_at_utc = 6;
  string updated_at_utc = 7;
}
message ListProductsResponse { repeated ProductResponse products = 1; }
message UpdatePlanRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 display_order = 4;
  RequestContext context = 5;
  double amount = 6;
  string currency = 7;
  string interval_unit = 8;
  int32 interval_count = 9;
}
message PlanResponse {
  string id = 1;
  string product_id = 2;
  string code = 3;
  string name = 4;
  string description = 5;
  string status = 6;
  int32 display_order = 7;
  string price_id = 8;
  double amount = 9;
  string currency = 10;
  string interval_unit = 11;
  int32 interval_count = 12;
  int32 active_subscriber_count = 13;
  string parent_plan_id = 14;
  string offer_id = 15;
  string checkout_plan_code = 16;
  string checkout_option_code = 17;
  bool is_offer = 18;
  string offer_phase_kind = 19;
  double offer_phase_amount = 20;
  string offer_phase_currency = 21;
  string offer_phase_duration_unit = 22;
  int32 offer_phase_duration_count = 23;
  double recurring_amount = 24;
  string recurring_currency = 25;
  string recurring_interval_unit = 26;
  int32 recurring_interval_count = 27;
  string display_name = 28;
  string display_description = 29;
  string badge_text = 30;
  reserved 31, 32, 33;
  reserved "highlight_rank", "is_recommended", "recommendation_reason";
  string terms_summary = 34;
  string disclosure_text = 35;
  string catalog_option_id = 36;
  repeated string features = 37;
}
message ListPlansResponse { repeated PlanResponse plans = 1; }
message PriceResponse {
  string id = 1;
  string plan_id = 2;
  string code = 3;
  double amount = 4;
  string currency = 5;
  string interval_unit = 6;
  int32 interval_count = 7;
  bool is_default = 8;
  bool is_active = 9;
  int32 active_subscriber_count = 10;
  string created_at_utc = 11;
  string updated_at_utc = 12;
}
message ListPricesResponse { repeated PriceResponse prices = 1; }
message PlanEntitlementResponse {
  string id = 1;
  string plan_id = 2;
  string feature_code = 3;
  string value = 4;
  double usage_limit = 5;
  bool has_usage_limit = 6;
  bool is_enabled = 7;
  string created_at_utc = 8;
  string updated_at_utc = 9;
}
message CatalogPresentationResponse {
  string id = 1;
  string plan_id = 2;
  string offer_id = 3;
  string display_name = 4;
  string display_description = 5;
  string badge_text = 6;
  reserved 7, 8, 9;
  reserved "highlight_rank", "is_recommended", "recommendation_reason";
  string terms_summary = 10;
  string disclosure_text = 11;
  bool is_enabled = 12;
  repeated string features = 13;
}
message PlanDetailResponse {
  PlanResponse plan = 1;
  repeated PriceResponse prices = 2;
  repeated PlanEntitlementResponse entitlements = 3;
  CatalogPresentationResponse presentation = 4;
  repeated OfferResponse offers = 5;
}
message ListOffersRequest { string plan_id = 1; bool enabled_only = 2; }
message OfferPhaseResponse {
  string id = 1;
  string offer_id = 2;
  string kind = 3;
  int32 sequence = 4;
  double amount = 5;
  string currency = 6;
  string duration_unit = 7;
  int32 duration_count = 8;
  bool is_enabled = 9;
}
message OfferPolicyResponse {
  string id = 1;
  string offer_id = 2;
  string policy_key = 3;
  string policy_value = 4;
}
message OfferResponse {
  string id = 1;
  string plan_id = 2;
  string price_id = 3;
  string code = 4;
  string name = 5;
  string description = 6;
  bool is_enabled = 7;
  string created_at_utc = 8;
  string updated_at_utc = 9;
  repeated OfferPhaseResponse phases = 10;
  CatalogPresentationResponse presentation = 11;
  repeated OfferPolicyResponse policies = 12;
  int32 display_order = 13;
}
message ListOffersResponse { repeated OfferResponse offers = 1; }

message ListPoliciesRequest {}
message BillingPolicyResponse {
  string id = 1;
  string product_id = 2;
  string plan_id = 3;
  string price_id = 4;
  int32 retry_count = 5;
  int32 retry_interval_hours = 6;
  int32 grace_days = 7;
  string failure_access_behavior = 8;
  bool is_enabled = 9;
}
message ListBillingPoliciesResponse { repeated BillingPolicyResponse policies = 1; }

message RequestContext {
  string correlation_id = 1;
  string request_id = 2;
  string actor_user_id = 3;
  string actor_type = 4;
  string ip_address = 5;
  string user_agent = 6;
  string reason = 7;
}

message EntityIdRequest {
  string id = 1;
  RequestContext context = 2;
}

message CustomerRequest {
  string customer_id = 1;
  RequestContext context = 2;
}

message ListSubscriptionsRequest {
  string customer_id = 1;
  string status = 2;
  int32 limit = 3;
}

message CreateProductRequest {
  string code = 1;
  string name = 2;
  string description = 3;
  RequestContext context = 4;
}

message CreatePlanRequest {
  string product_id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  RequestContext context = 5;
}

message CreatePriceRequest {
  string plan_id = 1;
  string code = 2;
  double amount = 3;
  string currency = 4;
  string interval_unit = 5;
  int32 interval_count = 6;
  bool is_default = 7;
  RequestContext context = 8;
}

message CreateOfferRequest {
  string plan_id = 1;
  string price_id = 2;
  string code = 3;
  string name = 4;
  string description = 5;
  RequestContext context = 6;
  repeated ConfigureOfferPhaseRequest phases = 7;
  ConfigureCatalogPresentationRequest presentation = 8;
  repeated OfferPolicyConfiguration policies = 9;
  int32 display_order = 10;
}

message OfferPolicyConfiguration {
  string policy_key = 1;
  string policy_value = 2;
}

message UpdateOfferRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  RequestContext context = 4;
  int32 display_order = 5;
}

message ConfigureOfferPhaseRequest {
  string offer_id = 1;
  string kind = 2;
  int32 sequence = 3;
  double amount = 4;
  string currency = 5;
  string duration_unit = 6;
  int32 duration_count = 7;
  bool is_enabled = 8;
  RequestContext context = 9;
}

message ConfigureCatalogPresentationRequest {
  string plan_id = 1;
  string offer_id = 2;
  string display_name = 3;
  string display_description = 4;
  string badge_text = 5;
  reserved 6, 7, 8;
  reserved "highlight_rank", "is_recommended", "recommendation_reason";
  string terms_summary = 9;
  string disclosure_text = 10;
  bool is_enabled = 11;
  RequestContext context = 12;
  repeated string features = 13;
}

message AttachEntitlementToPlanRequest {
  string plan_id = 1;
  string feature_code = 2;
  string value = 3;
  double usage_limit = 4;
  RequestContext context = 5;
}

message UpsertPlanEntitlementRequest {
  string plan_id = 1;
  string feature_code = 2;
  string value = 3;
  double usage_limit = 4;
  bool has_usage_limit = 5;
  bool is_enabled = 6;
  RequestContext context = 7;
}

message ConfigureOfferPolicyRequest {
  string offer_id = 1;
  string policy_key = 2;
  string policy_value = 3;
  RequestContext context = 4;
}

message ConfigureBillingPolicyRequest {
  string product_id = 1;
  string plan_id = 2;
  string price_id = 3;
  int32 retry_count = 4;
  int32 retry_interval_hours = 5;
  int32 grace_days = 6;
  string failure_access_behavior = 7;
  bool is_enabled = 8;
  RequestContext context = 9;
}

message StartSubscriptionRequest {
  string customer_id = 1;
  string product_id = 2;
  string plan_id = 3;
  string price_id = 4;
  string offer_id = 5;
  string payment_provider = 6;
  string external_reference = 7;
  bool charge_immediately = 8;
  RequestContext context = 9;
}

message ChangePlanRequest {
  string subscription_id = 1;
  string plan_id = 2;
  string price_id = 3;
  string callback_url = 4;
  string idempotency_key = 5;
  RequestContext context = 6;
}

message CheckEntitlementRequest {
  string subscription_id = 1;
  string feature_code = 2;
}

message RecordUsageRequest {
  string subscription_id = 1;
  string customer_id = 2;
  string feature_code = 3;
  double quantity = 4;
  string unit = 5;
  string idempotency_key = 6;
  RequestContext context = 7;
}

message CreateInvoiceRequest {
  string subscription_id = 1;
  string description = 2;
  RequestContext context = 3;
}

message RefundPaymentRequest {
  string payment_id = 1;
  string reason = 2;
  RequestContext context = 3;
}

message RetryPaymentRequest {
  string payment_id = 1;
  string reason = 2;
  RequestContext context = 3;
}

message PayInvoiceRequest {
  string invoice_id = 1;
  string customer_id = 2;
  RequestContext context = 3;
}

message CreateInvoiceCheckoutRequest {
  string invoice_id = 1;
  string customer_id = 2;
  string callback_url = 3;
  RequestContext context = 4;
}

message ListPaymentRetryQueueRequest {
  string status = 1;
  int32 limit = 2;
  RequestContext context = 3;
}

message PaymentRetryCaseResponse {
  string id = 1;
  string invoice_id = 2;
  string subscription_id = 3;
  string customer_id = 4;
  string customer_email = 5;
  string plan_id = 6;
  string plan_name = 7;
  double amount = 8;
  string currency = 9;
  int32 retry_count = 10;
  string next_retry_at_utc = 11;
  string expires_at_utc = 12;
  string status = 13;
  string invoice_status = 14;
  string last_payment_id = 15;
  string last_payment_status = 16;
  string last_failure_reason = 17;
  string last_attempted_at_utc = 18;
  bool due_now = 19;
}

message ListPaymentRetryQueueResponse {
  repeated PaymentRetryCaseResponse cases = 1;
}

message ProcessPaymentRetryQueueRequest {
  int32 per_batch = 1;
  int32 batches = 2;
  bool dry_run = 3;
  RequestContext context = 4;
}

message PaymentRetryBatchResponse {
  int32 due_count = 1;
  int32 completed_count = 2;
  int32 rescheduled_count = 3;
  int32 failed_count = 4;
  int32 remaining_count = 5;
  repeated PaymentResponse payments = 6;
}

message CancelPaymentRetryRequest {
  string retry_case_id = 1;
  string reason = 2;
  RequestContext context = 3;
}

message CreateCheckoutRequest {
  string customer_id = 1;
  string plan_code = 2;
  string billing_cycle = 3;
  string checkout_option_code = 4;
  string callback_url = 5;
  RequestContext context = 6;
}

message PaymentReferenceRequest {
  string reference = 1;
  RequestContext context = 2;
}

message ReceivePaystackWebhookRequest {
  string payload = 1;
  RequestContext context = 2;
}

message EntityResponse {
  string id = 1;
  string message = 2;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message SubscriptionStatusResponse {
  string subscription_id = 1;
  string status = 2;
  string access_behavior = 3;
}

message SubscriptionResponse {
  string id = 1;
  string customer_id = 2;
  string product_id = 3;
  string plan_id = 4;
  string price_id = 5;
  string offer_id = 6;
  string status = 7;
  string access_behavior = 8;
  string payment_provider = 9;
  string current_period_start_utc = 10;
  string current_period_end_utc = 11;
  string trial_ends_at_utc = 12;
  // Set when the customer has cancelled but still holds the period they paid for. The status
  // stays Active until this passes, so it is the only thing that distinguishes the two.
  string cancel_at_period_end_utc = 13;
  // Whether there is a card the service can charge on its own, so the caller can offer the
  // right recovery action instead of finding out after the customer presses Pay now.
  bool has_reusable_payment_method = 14;
}

message PlanChangeResponse {
  string id = 1;
  string subscription_id = 2;
  string from_plan_id = 3;
  string from_price_id = 4;
  string to_plan_id = 5;
  string to_price_id = 6;
  string kind = 7;
  string status = 8;
  string invoice_id = 9;
  double unused_credit = 10;
  double prorated_charge = 11;
  double amount_due = 12;
  string currency = 13;
  string effective_at_utc = 14;
  string applied_at_utc = 15;
  string failure_reason = 16;
  PaymentIntentResponse payment_intent = 17;
  SubscriptionResponse subscription = 18;
}

message ListSubscriptionsResponse { repeated SubscriptionResponse subscriptions = 1; }

message CheckEntitlementResponse {
  bool allowed = 1;
  string access_behavior = 2;
  string reason = 3;
  string value = 4;
}

message EntitlementSnapshotResponse {
  string subscription_id = 1;
  string customer_id = 2;
  string access_behavior = 3;
  string snapshot_json = 4;
  string calculated_at_utc = 5;
}

message InvoiceResponse {
  string id = 1;
  string subscription_id = 2;
  string customer_id = 3;
  string number = 4;
  string status = 5;
  double total_amount = 6;
  double amount_due = 7;
  string currency = 8;
  string due_at_utc = 9;
  string paid_at_utc = 10;
}

message ListInvoicesResponse {
  repeated InvoiceResponse invoices = 1;
}

message ListBillingDocumentsRequest {
  string customer_id = 1;
  string status = 2;
  int32 limit = 3;
  RequestContext context = 4;
}

message PaymentIntentResponse {
  string id = 1;
  string invoice_id = 2;
  string subscription_id = 3;
  string provider = 4;
  string status = 5;
  string provider_reference = 6;
  string checkout_url = 7;
}

message CheckoutResponse {
  SubscriptionResponse subscription = 1;
  PaymentIntentResponse payment_intent = 2;
  bool requires_payment = 3;
  string conversion_event_id = 4;
}

message PaymentResponse {
  string id = 1;
  string invoice_id = 2;
  string subscription_id = 3;
  string provider = 4;
  string status = 5;
  double amount = 6;
  string currency = 7;
  string provider_reference = 8;
  string processed_at_utc = 9;
  string failure_reason = 10;
  bool is_first_customer_payment = 11;
  string conversion_event_id = 12;
}

message ListPaymentsResponse { repeated PaymentResponse payments = 1; }

message ListLedgerAccountsRequest {}
message LedgerAccountResponse {
  string id = 1;
  string code = 2;
  string name = 3;
  string category = 4;
  bool is_system = 5;
}
message ListLedgerAccountsResponse { repeated LedgerAccountResponse accounts = 1; }

message ListLedgerTransactionsRequest {
  string reference = 1;
  int32 limit = 2;
}
message LedgerEntryResponse {
  string id = 1;
  string ledger_account_id = 2;
  string direction = 3;
  double amount = 4;
  string currency = 5;
  string memo = 6;
}
message LedgerTransactionResponse {
  string id = 1;
  string reference = 2;
  string description = 3;
  string posted_at_utc = 4;
  repeated LedgerEntryResponse entries = 5;
}
message ListLedgerTransactionsResponse { repeated LedgerTransactionResponse transactions = 1; }
